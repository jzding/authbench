<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 z" fill="#334155"/></marker>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 z" fill="#059669"/></marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="aR" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1040" fill="#ffffff"/>

  <text x="700" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Real in-cluster O-RAN ocloudNotifications v2 path — and where authbench's numbers apply</text>
  <text x="700" y="60" text-anchor="middle" font-size="14" fill="#475569">GNSS/PTP event detection → producer → the 3 secured interface legs → Event Consumer · secured build, inter-node consumer shown</text>

  <!-- ============ TOP: real flow ============ -->
  <!-- Producer POD -->
  <rect x="40" y="90" width="620" height="455" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="58" y="116" font-size="15" font-weight="700" fill="#075985">Producer POD  (Kubernetes node)</text>

  <rect x="70" y="140" width="230" height="66" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="185" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">GNSS / PHC / DPLL</text>
  <text x="185" y="188" text-anchor="middle" font-size="12" fill="#0c4a6e">hardware timing source</text>

  <line x1="185" y1="206" x2="185" y2="244" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="197" y="230" font-size="11.5" fill="#64748b">event detection</text>

  <rect x="70" y="246" width="230" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="185" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">linuxptp-daemon</text>
  <text x="185" y="300" text-anchor="middle" font-size="12" fill="#0c4a6e">PTP event producer</text>

  <line x1="300" y1="286" x2="358" y2="286" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="312" y="270" text-anchor="middle" font-size="11" fill="#64748b">UNIX socket</text>
  <text x="312" y="310" text-anchor="middle" font-size="10.5" fill="#94a3b8">in-pod, plaintext</text>

  <rect x="360" y="200" width="278" height="250" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="499" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">cloud-event-proxy</text>
  <text x="499" y="243" text-anchor="middle" font-size="12" fill="#1e40af">API Producer / publisher :9043</text>
  <g font-size="12" fill="#1e3a5f">
    <text x="376" y="270">• embeds rest-api Server</text>
    <text x="376" y="292">• registers publishers, holds state</text>
    <text x="376" y="314">• Service-CA serving cert (ECDSA)</text>
    <text x="376" y="336">• tokenCache — TokenReview, 30 s TTL</text>
    <text x="376" y="358">• push client presents cert + token</text>
  </g>
  <text x="376" y="392" font-size="11" font-style="italic" fill="#64748b">the daemon→cep socket is in-pod &amp; internal —</text>
  <text x="376" y="408" font-size="11" font-style="italic" fill="#64748b">outside the O-RAN interface auth scope</text>

  <!-- CNI divider -->
  <line x1="700" y1="100" x2="700" y2="545" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">CNI network — pod-to-pod</text>

  <!-- Consumer POD -->
  <rect x="740" y="90" width="620" height="455" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="758" y="116" font-size="15" font-weight="700" fill="#166534">Consumer POD  (separate POD/VM)</text>

  <rect x="1090" y="200" width="250" height="250" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="1215" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Event Consumer</text>
  <text x="1215" y="243" text-anchor="middle" font-size="12" fill="#166534">subscriber</text>
  <g font-size="12" fill="#14532d">
    <text x="1106" y="278">• /event callback :9043</text>
    <text x="1106" y="300">• HTTPS + mTLS server</text>
    <text x="1106" y="322">• callbackAuthMiddleware</text>
    <text x="1106" y="344">• presents client cert +</text>
    <text x="1106" y="362">   Bearer token (control/pull)</text>
  </g>

  <!-- 3 legs between cep(638) and consumer(1090) -->
  <!-- Leg 1 CONTROL (consumer -> publisher) -->
  <line x1="1090" y1="278" x2="640" y2="278" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="865" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">① CONTROL — subscribe / delete / health</text>
  <!-- Leg 2 PULL (consumer -> publisher) -->
  <line x1="1090" y1="336" x2="640" y2="336" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="865" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">② PULL — CurrentState (fetch event data)</text>
  <!-- Leg 3 PUSH (publisher -> consumer) RED -->
  <line x1="640" y1="410" x2="1088" y2="410" stroke="#dc2626" stroke-width="2.8" marker-end="url(#aR)"/>
  <text x="865" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">③ PUSH — CloudEvent POST → /event</text>

  <text x="865" y="430" text-anchor="middle" font-size="11.5" fill="#475569">every leg: HTTPS + mTLS + OAuth (TokenReview)</text>

  <!-- overhead pills -->
  <rect x="775" y="286" width="120" height="24" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="835" y="303" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">+18–22 µs · +10%</text>
  <rect x="775" y="344" width="120" height="24" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="835" y="361" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">+18–22 µs · +10%</text>
  <rect x="775" y="446" width="112" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.1"/>
  <text x="831" y="463" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">+50 µs · +28%</text>
  <text x="905" y="463" font-size="11.5" font-weight="700" fill="#b91c1c">◀ authbench [4c] isolates exactly this hop</text>

  <!-- intra-node note -->
  <rect x="40" y="500" width="620" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="350" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">INTRA-NODE (consumer in the SAME POD/VM) — the spec's PRIMARY focus:</text>
  <text x="350" y="532" text-anchor="middle" font-size="12" fill="#065f46">all legs stay on the in-pod loopback fast-path → plaintext, auth-exempt → +0 µs / 0% overhead</text>

  <!-- ============ BOTTOM: why authbench ============ -->
  <text x="40" y="595" font-size="16" font-weight="700" fill="#334155">Why authbench — not the live cluster — gives the authoritative auth-cost number</text>

  <!-- left: live noise -->
  <rect x="40" y="612" width="640" height="220" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="360" y="637" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Live in-cluster measurement — dominated by noise</text>
  <g font-size="13" fill="#7f1d1d">
    <text x="62" y="666">• one push read end-to-end as 15–29 ms</text>
    <text x="62" y="692">• of which ~1.7 ms was a COLD TLS handshake</text>
    <text x="62" y="718">• + CNI datapath, scheduler jitter, process startup</text>
    <text x="62" y="744">• + kube-apiserver TokenReview cold RTT (cache miss)</text>
  </g>
  <rect x="62" y="762" width="596" height="50" rx="6" fill="#fee2e2"/>
  <text x="360" y="792" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">a ±ms-noisy number cannot expose a +50 µs signal</text>

  <!-- right: authbench isolation -->
  <rect x="700" y="612" width="660" height="220" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="1030" y="637" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">authbench — isolates the CPU cost</text>
  <g font-size="13" fill="#1e3a5f">
    <text x="722" y="666">• single process, loopback, warm REUSED connection</text>
    <text x="722" y="692">• handshake measured separately (excluded — keep-alive)</text>
    <text x="722" y="718">• token cache HIT only (cold TokenReview RTT excluded)</text>
    <text x="722" y="744">• n = 10,000 → p50 / p99, on x86 (cluster-matched arch)</text>
  </g>
  <rect x="722" y="762" width="616" height="50" rx="6" fill="#dbeafe"/>
  <text x="1030" y="792" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">attributes +50 µs push / +16 µs app-auth cleanly</text>

  <!-- mapping table -->
  <text x="40" y="868" font-size="14" font-weight="700" fill="#334155">Mapping: which real leg each authbench measurement stands in for</text>
  <rect x="40" y="882" width="1320" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <!-- header row -->
  <text x="70" y="908" font-size="12.5" font-weight="700" fill="#475569">Real interface leg</text>
  <text x="560" y="908" font-size="12.5" font-weight="700" fill="#475569">authbench measurement</text>
  <text x="980" y="908" font-size="12.5" font-weight="700" fill="#475569">overhead attributed</text>
  <line x1="60" y1="918" x2="1340" y2="918" stroke="#e2e8f0" stroke-width="1.2"/>
  <g font-size="12.5" fill="#0f172a">
    <text x="70" y="944">③ PUSH — publisher → consumer /event</text>
    <text x="560" y="944">[4c] warm secured round-trip vs [4a] plaintext</text>
    <text x="980" y="944" font-weight="700" fill="#b91c1c">+50 µs (p50) full secured push</text>

    <text x="70" y="972">①/② CONTROL + PULL — consumer → publisher</text>
    <text x="560" y="972">warm HTTPS-mTLS POST / CurrentState fetch</text>
    <text x="980" y="972" font-weight="700" fill="#1d4ed8">+18–22 µs (+10%)</text>

    <text x="70" y="1000">connection setup (any leg, first request)</text>
    <text x="560" y="1000">[2] full mTLS handshake (ECDSA-P256)</text>
    <text x="980" y="1000" font-weight="700" fill="#64748b">~1.7 ms once → ~0 amortized (keep-alive)</text>
  </g>
</svg>
